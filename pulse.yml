name: Refresh contribution pulse

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 06:17 Cairo
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build_pulse.py, .github/workflows/pulse.yml]

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render assets/pulse.svg
        env:
          # Optional: a classic PAT with read:user in secret PULSE_TOKEN makes the
          # count include private contributions exactly as your profile shows them.
          GITHUB_TOKEN: ${{ secrets.PULSE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/build_pulse.py --out assets/pulse.svg
      - name: Commit if changed
        run: |
          git config user.name  "pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pulse.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution pulse"
          git push
