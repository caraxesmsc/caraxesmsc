name: Refresh profile stats

# Rebuilds assets/pulse.svg (contribution heatmap, total, streaks, busiest week,
# peak day, "LIVE" date) once a night, using Cairo's local timezone.
# Avoid the top of the hour, and still refresh if GitHub starts the job late.

on:
  schedule:
    - cron: "17 0 * * *"
      timezone: Africa/Cairo
  workflow_dispatch:        # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: [scripts/build_pulse.py, .github/workflows/pulse.yml]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PROFILE_TZ: Africa/Cairo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render assets/pulse.svg
        env:
          # Optional: a classic token with only read:user, saved as the secret
          # PULSE_TOKEN, makes the count include private contributions exactly
          # as your profile shows them.
          GITHUB_TOKEN: ${{ secrets.PULSE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/build_pulse.py --out assets/pulse.svg

      - name: Give the image a fresh link so caches can't show yesterday's graph
        run: |
          stamp=$(TZ="$PROFILE_TZ" date +%Y%m%d)
          sed -i -E "s#\./assets/pulse\.svg(\?v=[0-9]+)?#./assets/pulse.svg?v=${stamp}#" README.md
          grep -o 'assets/pulse.svg[^"]*' README.md

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pulse.svg README.md
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: refresh profile stats ($(TZ="$PROFILE_TZ" date +%F))"
            git push
          fi
