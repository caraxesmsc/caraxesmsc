<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
<title id="title">The Caraxes workbench</title>
<desc id="desc">Terminal-style focus panel: Build useful web applications. Explore practical AI and automation. Make the details feel right. The build loop: idea, build, refine.</desc>

<defs><linearGradient id="screen" x2="1" y2="1"><stop stop-color="#141820"/><stop offset="1" stop-color="#101319"/></linearGradient></defs>
<style>.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.cursor{animation:b 1.5s steps(2,end) infinite}@keyframes b{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.cursor{animation:none}}</style>
<rect x=".5" y=".5" width="1199" height="209" rx="12" fill="url(#screen)" stroke="#30343e"/>
<path d="M1 39H1199" stroke="#30343e"/>
<circle cx="24" cy="20" r="5" fill="#e27569"/><circle cx="44" cy="20" r="5" fill="#d5ac6e"/><circle cx="64" cy="20" r="5" fill="#7fa393"/>
<text x="600" y="25" text-anchor="middle" class="m" fill="#9398a3" font-size="12">caraxesmsc — ~/workbench</text>
<text x="30" y="77" class="m" font-size="17" fill="#e49a7b">❯ <tspan fill="#f0ece7">cat focus.txt</tspan></text>
<text x="48" y="114" class="m" font-size="16" fill="#9da5b3">01 <tspan fill="#e0ddd8">Build useful web applications.</tspan></text>
<text x="48" y="144" class="m" font-size="16" fill="#9da5b3">02 <tspan fill="#e0ddd8">Explore practical AI and automation.</tspan></text>
<text x="48" y="174" class="m" font-size="16" fill="#9da5b3">03 <tspan fill="#e0ddd8">Make the details feel right.</tspan></text>
<path d="M855 76V176" stroke="#34313a"/>
<text x="893" y="99" class="m" font-size="12" letter-spacing="1.8" fill="#db9981">THE BUILD LOOP</text>
<text x="893" y="134" class="m" font-size="15" fill="#e0ddd8">idea → build → refine</text>
<text x="893" y="168" class="m" font-size="12" fill="#9398a3">repeat with curiosity<tspan class="cursor" fill="#e49a7b">_</tspan></text>

</svg>
