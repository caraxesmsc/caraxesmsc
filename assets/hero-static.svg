<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Mohamed Hossam — software, with a spark.</title>
<desc id="desc">A charcoal and crimson developer banner with an original geometric dragon, a slowly rotating orbit, floating embers, and a blinking terminal cursor. Web applications, AI, automation. Respects reduced-motion preferences.</desc>

<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151820"/><stop offset=".55" stop-color="#0d1117"/><stop offset="1" stop-color="#24151b"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#ae3c36" stop-opacity=".23"/><stop offset="1" stop-color="#ae3c36" stop-opacity="0"/></radialGradient>
  <linearGradient id="dragonFill" x2=".6" y2="1"><stop stop-color="#73302e"/><stop offset="1" stop-color="#301c27"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  <linearGradient id="line"><stop stop-color="#f39269"/><stop offset=".5" stop-color="#df5b51"/><stop offset="1" stop-color="#df5b51" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .orbit{transform-origin:939px 210px;animation:orbit 48s linear infinite}
  .breath{transform-origin:939px 210px;animation:breath 7s ease-in-out infinite}
  .ember{animation:ember 6s ease-in-out infinite}.e1{animation-delay:-1.5s}.e2{animation-delay:-3s}.e3{animation-delay:-4.5s}
  .cursor{animation:blink 1.5s steps(2,end) infinite}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes breath{50%{opacity:.77;transform:translateY(-3px)}}
  @keyframes ember{50%{opacity:.08;transform:translateY(-9px)}}
  @keyframes blink{50%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.orbit,.breath,.ember,.cursor{animation:none}}
*{animation:none!important}</style>
