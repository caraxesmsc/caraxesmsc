<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Capstone: AI-Powered MBSE Copilot for Eclipse Capella, with the Siemens Egypt AE Team</title>
<desc id="d">Request flow: an engineer's natural-language request goes to an LLM agent, then to the MCP server (Python, task planning and validation), then through a control gateway that checks layer isolation, dependencies, duplicate elements and transactions, then over a Py4J bridge to Eclipse Capella running Java in-process, which edits the live MBSE model. Unsafe changes are rejected at the gateway. The MCP server and control gateway are the layer Mohamed owned.</desc>
<style>
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .box{fill:#121820;stroke:#2a323d}
  .mine{fill:#1a1310;stroke:#ff8a4c}
  .h{font:700 12px 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:.08em;fill:#e8edf2}
  .s{font:12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#8b949e}
  .wire{fill:none;stroke:#2a323d;stroke-width:2;stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-20}}
  .pk{offset-path:path('M160,150 H720 V218 H160 V255 H280 V300 H720');offset-rotate:0deg;offset-anchor:0 0;opacity:0}
  .ok{animation:ok 10s .6s infinite}
  .bad{animation:bad 10s .6s infinite}
  @keyframes ok{0%{offset-distance:0%;opacity:1}30%,40%{offset-distance:66.9%;opacity:1}50%{offset-distance:100%;opacity:1}53%,100%{offset-distance:100%;opacity:0}}
  @keyframes bad{0%,53%{offset-distance:0%;opacity:0}54%{offset-distance:0%;opacity:1}80%{offset-distance:66.9%;opacity:1}81%,84%,87%{offset-distance:66.4%}82.5%,85.5%,88%{offset-distance:67.4%}89%{offset-distance:66.9%;opacity:1}94%,100%{offset-distance:66.9%;opacity:0}}
  .tick{animation:tick1 10s .6s infinite}
  .t2{animation-name:tick2}.t3{animation-name:tick3}.t4{animation-name:tick4}
  @keyframes tick1{0%,30.5%{opacity:.18}31.5%,52%{opacity:1}54%,100%{opacity:.18}}
  @keyframes tick2{0%,32.5%{opacity:.18}33.5%,52%{opacity:1}54%,100%{opacity:.18}}
  @keyframes tick3{0%,34.5%{opacity:.18}35.5%,52%{opacity:1}54%,100%{opacity:.18}}
  @keyframes tick4{0%,36.5%{opacity:.18}37.5%,52%{opacity:1}54%,100%{opacity:.18}}
  .gate{animation:gate 10s .6s infinite}
  @keyframes gate{0%,79%{stroke:#ff8a4c}80%,92%{stroke:#f85149}94%,100%{stroke:#ff8a4c}}
  .rej{opacity:0;animation:rej 10s .6s infinite}
  @keyframes rej{0%,80%{opacity:0}81%,92%{opacity:1}95%,100%{opacity:0}}
  .model{animation:model 10s .6s infinite}
  @keyframes model{0%,48%{fill:#121820;stroke:#2a323d}50%{fill:#12261a;stroke:#3fb950}62%,100%{fill:#121820;stroke:#2a323d}}
  .in{animation:in .8s cubic-bezier(.2,.8,.2,1) backwards}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}
</style>
<defs>
  <filter id="bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#141a21"/></pattern>
</defs>
<rect width="880" height="450" rx="14" fill="#0b0f14"/>
<rect width="880" height="450" rx="14" fill="url(#grid)"/>
<rect x=".5" y=".5" width="879" height="449" rx="13.5" fill="none" stroke="#232a33"/>

<!-- header -->
<g class="in">
  <text x="40" y="44" class="mono" font-size="10.5" letter-spacing=".18em" fill="#ff8a4c">CAPSTONE · 2025 – 2026 · WITH SIEMENS EGYPT AE TEAM</text>
  <text x="40" y="74" class="sans" font-size="23" font-weight="800" fill="#f0f3f6" letter-spacing="-.3">AI-Powered MBSE Copilot for Eclipse Capella</text>
  <text x="40" y="97" class="sans" font-size="13.5" fill="#8b949e">An LLM proposes changes to a live systems-engineering model. Nothing lands until the gateway says it's safe.</text>
</g>

<!-- wires (behind boxes) -->
<path class="wire" d="M280,150 H320 M560,150 H600 M720,185 V218 H160 V255 M280,300 H320 M560,300 H600"/>

<!-- ownership brackets -->
<g class="mono">
  <rect x="592" y="107" width="256" height="86" rx="12" fill="none" stroke="#ff8a4c" stroke-opacity=".35" stroke-dasharray="3 4"/>
  <rect x="32" y="247" width="256" height="114" rx="12" fill="none" stroke="#ff8a4c" stroke-opacity=".35" stroke-dasharray="3 4"/>
  <rect x="770" y="100" width="70" height="16" rx="4" fill="#ff8a4c"/>
  <text x="805" y="111.5" font-size="9" font-weight="700" letter-spacing=".12em" fill="#0b0f14" text-anchor="middle">MY LAYER</text>
  <rect x="40" y="353" width="70" height="16" rx="4" fill="#ff8a4c"/>
  <text x="75" y="364.5" font-size="9" font-weight="700" letter-spacing=".12em" fill="#0b0f14" text-anchor="middle">MY LAYER</text>
</g>

<!-- row 1 -->
<rect class="box" x="40" y="115" width="240" height="70" rx="9"/>
<text class="h" x="58" y="143">01 ENGINEER</text>
<text class="s" x="58" y="166">natural-language request</text>

<rect class="box" x="320" y="115" width="240" height="70" rx="9"/>
<text class="h" x="338" y="143">02 LLM AGENT</text>
<text class="s" x="338" y="166">plans steps · calls tools</text>

<rect class="mine" x="600" y="115" width="240" height="70" rx="9"/>
<text class="h" x="618" y="143">03 MCP SERVER <tspan fill="#8b949e" font-weight="400">· Python</tspan></text>
<text class="s" x="618" y="166">task planning · request validation</text>

<!-- row 2 -->
<rect class="mine gate" x="40" y="255" width="240" height="90" rx="9"/>
<text class="h" x="58" y="281">04 CONTROL GATEWAY</text>
<g class="s" font-size="12">
  <g class="tick t1"><text x="58" y="305" fill="#3fb950">✓</text><text x="74" y="305">layer isolation</text></g>
  <g class="tick t2"><text x="168" y="305" fill="#3fb950">✓</text><text x="184" y="305">dependencies</text></g>
  <g class="tick t3"><text x="58" y="329" fill="#3fb950">✓</text><text x="74" y="329">no duplicates</text></g>
  <g class="tick t4"><text x="168" y="329" fill="#3fb950">✓</text><text x="184" y="329">transactions</text></g>
</g>
<g class="rej mono"><rect x="118" y="352" width="162" height="20" rx="5" fill="#2a1214" stroke="#f85149"/><text x="199" y="365.5" font-size="9.5" fill="#ff7b72" text-anchor="middle" letter-spacing=".04em">✕ REJECTED · duplicate</text></g>

<rect class="box" x="320" y="265" width="240" height="70" rx="9"/>
<text class="h" x="338" y="293">05 PY4J BRIDGE</text>
<text class="s" x="338" y="316">Python ⇄ JVM, in-process</text>

<rect class="box model" x="600" y="265" width="240" height="70" rx="9"/>
<text class="h" x="618" y="293">06 ECLIPSE CAPELLA</text>
<text class="s" x="618" y="316">Java plugin · live MBSE model</text>

<!-- packets -->
<g class="pk ok"><circle r="10" fill="#ff8a4c" filter="url(#bl)" opacity=".75"/><circle r="4" fill="#fff"/></g>
<g class="pk bad"><circle r="10" fill="#f85149" filter="url(#bl)" opacity=".75"/><circle r="4" fill="#ffd8d3"/></g>

<!-- footer -->
<line x1="40" x2="840" y1="398" y2="398" stroke="#232a33"/>
<g class="mono" font-size="10.5" fill="#8b949e" letter-spacing=".04em">
  <text x="40" y="424"><tspan fill="#ff8a4c">■</tspan> Dockerized env</text>
  <text x="200" y="424"><tspan fill="#ff8a4c">■</tspan> deterministic testbench</text>
  <text x="410" y="424"><tspan fill="#ff8a4c">■</tspan> RAG · ML in the loop</text>
  <text x="840" y="424" text-anchor="end">code under NDA · demo on request</text>
</g>
</svg>
