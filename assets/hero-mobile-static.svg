<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="title desc">
<title id="title">Mohamed Hossam — software, with a spark.</title>
<desc id="desc">Mobile version of the crimson dragon developer banner. Web, AI, automation. Animated dragon and terminal cursor; reduced-motion support.</desc>

<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151820"/><stop offset="1" stop-color="#24151b"/></linearGradient>
<linearGradient id="dragonFill" x2=".6" y2="1"><stop stop-color="#73302e"/><stop offset="1" stop-color="#301c27"/></linearGradient>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
</defs>
<style>.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.dragon{animation:breathe 7s ease-in-out infinite}.cursor{animation:blink 1.5s steps(2,end) infinite}@keyframes breathe{50%{opacity:.6}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.dragon,.cursor{animation:none}}*{animation:none!important}</style>
<rect x=".5" y=".5" width="639" height="579" rx="16" fill="url(#bg)" stroke="#44343a"/>
<rect x="1" y="1" width="638" height="578" rx="16" fill="url(#g)"/>
