<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Mohamed Hossam Abdelalim — Computer &amp; Systems Engineer</title>
<desc id="d">From logic gates to LLM agents. A signal climbs a six-layer stack: gates (Verilog, VHDL), CPU (MIPS datapath), kernel (MINIX 3), compiler (lexer to AST), cloud (Django on GCP), agents (MCP and LLMs).</desc>
<style>
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .in{animation:in .9s cubic-bezier(.2,.8,.2,1) backwards}
  @keyframes in{from{opacity:0;transform:translateY(10px)}}
  .draw{stroke-dasharray:240;animation:draw 1.4s .4s ease-out backwards}
  @keyframes draw{from{stroke-dashoffset:240}}
  .rung rect{fill:#121820;stroke:#2a323d;animation:litbox 6s infinite}
  .rung .lb{fill:#c9d1d9;animation:littext 6s infinite}
  .rung .sub{fill:#6e7781}
  .rung .node{fill:#2a323d;animation:litnode 6s infinite}
  .r0 *{animation-delay:1.2s}.r1 *{animation-delay:1.92s}.r2 *{animation-delay:2.64s}
  .r3 *{animation-delay:3.36s}.r4 *{animation-delay:4.08s}.r5 *{animation-delay:4.8s}
  @keyframes litbox{0%,100%{fill:#121820;stroke:#2a323d}4%{fill:#2a1510;stroke:#ff8a4c}22%{fill:#161b22;stroke:#5a3426}}
  @keyframes litnode{0%,100%{fill:#2a323d}4%{fill:#ff8a4c}22%{fill:#8a2f1c}}
  @keyframes littext{0%,100%{fill:#c9d1d9}4%{fill:#ffffff}}
  .pulse{animation:climb 6s 1.2s linear infinite;opacity:0}
  @keyframes climb{0%{transform:translateY(0);opacity:1}60%{transform:translateY(-190px);opacity:1}64%,100%{transform:translateY(-190px);opacity:0}}
  .cur{animation:blink 1.1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse{display:none}}
</style>
<defs>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#161c24" stroke-width="1"/></pattern>
  <radialGradient id="glow" cx=".82" cy=".55" r=".55"><stop offset="0" stop-color="#ff6a2b" stop-opacity=".14"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/></radialGradient>
  <filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="880" height="300" rx="14" fill="#0b0f14"/>
<rect width="880" height="300" rx="14" fill="url(#grid)"/>
<rect width="880" height="300" rx="14" fill="url(#glow)"/>
<rect x=".5" y=".5" width="879" height="299" rx="13.5" fill="none" stroke="#232a33"/>

<!-- left: identity -->
<g class="in" style="animation-delay:.05s">
  <circle cx="46" cy="52" r="3.5" fill="#ff8a4c"/>
  <text x="58" y="56" class="mono" font-size="10.5" letter-spacing=".18em" fill="#8b949e">CARAXESMSC · CAIRO, EG</text>
</g>
<g class="in sans" style="animation-delay:.15s" fill="#f0f3f6" font-weight="800">
  <text x="40" y="112" font-size="46" letter-spacing="-1.2">Mohamed Hossam</text>
  <text x="40" y="150" font-size="26" letter-spacing="-.4" fill="#8b949e" font-weight="700">Abdelalim</text>
</g>
<g class="in sans" style="animation-delay:.3s">
  <text x="40" y="192" font-size="18" font-weight="600" fill="#ff8a4c">Computer &amp; Systems Engineer</text>
  <text x="40" y="216" font-size="15" fill="#c9d1d9">From logic gates to LLM agents — I build every layer in between.</text>
</g>
<g class="in mono" style="animation-delay:.45s" font-size="11.5">
  <rect x="40" y="238" width="420" height="30" rx="7" fill="#121820" stroke="#232a33"/>
  <text x="54" y="257" fill="#6e7781">now<tspan fill="#ff8a4c"> ❯ </tspan><tspan fill="#c9d1d9">AI-powered MBSE copilot · Siemens Egypt</tspan></text>
  <rect class="cur" x="446" y="246" width="7" height="14" fill="#ff8a4c"/>
</g>

<!-- right: the stack, bottom (gates) to top (agents) -->
<g class="mono">
  <line x1="560" y1="52" x2="560" y2="250" stroke="#2a323d" stroke-width="2" class="draw"/>
  <g class="rung r5"><rect x="580" y="38" width="260" height="28" rx="7"/><circle class="node" cx="560" cy="52" r="5"/><text class="lb" x="594" y="57" font-size="12" font-weight="700">AGENTS</text><text class="sub" x="826" y="57" font-size="10.5" text-anchor="end">MCP · LLMs · RAG</text></g>
  <g class="rung r4"><rect x="580" y="76" width="260" height="28" rx="7"/><circle class="node" cx="560" cy="90" r="5"/><text class="lb" x="594" y="95" font-size="12" font-weight="700">CLOUD</text><text class="sub" x="826" y="95" font-size="10.5" text-anchor="end">Django · GCP · Docker</text></g>
  <g class="rung r3"><rect x="580" y="114" width="260" height="28" rx="7"/><circle class="node" cx="560" cy="128" r="5"/><text class="lb" x="594" y="133" font-size="12" font-weight="700">COMPILER</text><text class="sub" x="826" y="133" font-size="10.5" text-anchor="end">lexer → parser → AST</text></g>
  <g class="rung r2"><rect x="580" y="152" width="260" height="28" rx="7"/><circle class="node" cx="560" cy="166" r="5"/><text class="lb" x="594" y="171" font-size="12" font-weight="700">KERNEL</text><text class="sub" x="826" y="171" font-size="10.5" text-anchor="end">MINIX 3 · sched · paging</text></g>
  <g class="rung r1"><rect x="580" y="190" width="260" height="28" rx="7"/><circle class="node" cx="560" cy="204" r="5"/><text class="lb" x="594" y="209" font-size="12" font-weight="700">CPU</text><text class="sub" x="826" y="209" font-size="10.5" text-anchor="end">MIPS datapath · VHDL</text></g>
  <g class="rung r0"><rect x="580" y="228" width="260" height="28" rx="7"/><circle class="node" cx="560" cy="242" r="5"/><text class="lb" x="594" y="247" font-size="12" font-weight="700">GATES</text><text class="sub" x="826" y="247" font-size="10.5" text-anchor="end">Verilog · ASIC flow</text></g>
  <g class="pulse"><circle cx="560" cy="242" r="9" fill="#ff8a4c" filter="url(#bl)" opacity=".7"/><circle cx="560" cy="242" r="3.5" fill="#fff"/></g>
  <text x="840" y="282" font-size="9.5" letter-spacing=".16em" fill="#6e7781" text-anchor="end">SIGNAL PATH · GATES → AGENTS</text>
</g>
</svg>
